<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Noisy</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222e;
      --border: #2e2e3e;
      --accent: #7c6ff7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --text-muted: #7070a0;
      --user-bubble: #2d2060;
      --ai-bubble: #1e1e2a;
      --scrollbar: #2e2e3e;
      --danger: #f87171;
      --success: #34d399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, .btn-small {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    select:hover, .btn-small:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    select:focus { outline: none; border-color: var(--accent); }

    .btn-small {
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .status-dot.offline { background: var(--danger); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── API KEY BANNER ── */
    #api-banner {
      background: linear-gradient(90deg, #1e1a40, #1a1a2e);
      border-bottom: 1px solid var(--accent);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #api-banner.hidden { display: none; }

    #api-banner span {
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #api-key-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: monospace;
      transition: border-color .2s;
    }

    #api-key-input:focus { outline: none; border-color: var(--accent); }

    .btn-save {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }

    .btn-save:hover { opacity: 0.85; }
    .btn-save:active { transform: scale(.97); }

    /* ── SYSTEM PROMPT PANEL ── */
    #system-panel {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: none;
      gap: 10px;
      flex-direction: column;
    }

    #system-panel.open { display: flex; }

    #system-panel label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #system-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      resize: vertical;
      min-height: 70px;
      max-height: 160px;
      font-family: inherit;
      transition: border-color .2s;
    }

    #system-prompt:focus { outline: none; border-color: var(--accent); }

    /* ── MESSAGES AREA ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    /* Welcome screen */
    #welcome {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      max-width: 480px;
    }

    #welcome .big-icon { font-size: 3rem; margin-bottom: 16px; }
    #welcome h2 { font-size: 1.5rem; margin-bottom: 8px; }
    #welcome p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      justify-content: center;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: var(--surface);
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      animation: fadeUp .25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.ai   { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .avatar { background: var(--user-bubble); }
    .msg.ai .avatar   { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .bubble {
      max-width: calc(100% - 50px);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.93rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .msg.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Markdown inside AI bubble */
    .bubble h1,.bubble h2,.bubble h3 { margin: 8px 0 4px; font-size: 1em; }
    .bubble ul,.bubble ol { padding-left: 20px; }
    .bubble li { margin: 3px 0; }
    .bubble code {
      background: rgba(124,111,247,0.15);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 0.88em;
    }
    .bubble pre {
      background: #0d0d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble strong { color: var(--accent2); }
    .bubble a { color: var(--accent2); text-decoration: underline; }
    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: var(--text-muted);
      margin: 6px 0;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex; gap: 4px; align-items: center; padding: 4px 0;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes dot {
      0%,80%,100% { transform: scale(.8); opacity:.5; }
      40% { transform: scale(1.2); opacity:1; }
    }

    /* ── INPUT AREA ── */
    footer {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.93rem;
      resize: none;
      max-height: 160px;
      min-height: 48px;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color .2s;
    }

    #user-input:focus { outline: none; border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 48px; height: 48px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .2s, transform .1s;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-send:hover { opacity: 0.85; }
    .btn-send:active { transform: scale(.95); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .footer-note {
      display: none;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      z-index: 999;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 10px 14px; }
      #chat { padding: 16px 12px; }
      footer { padding: 10px 12px; }
      .logo span { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">✨</div>
    <span>Noisy</span>
  </div>
  <div class="header-controls">
    <div class="status-dot" id="status-dot"></div>
    <select id="model-select" title="Modelo de IA">
      <option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 120B (Recomendado)</option>
      <option value="google/gemma-4-31b-it:free">Gemma 4 31B</option>
      <option value="qwen/qwen3.8-27b:free">Qwen 3.8 27B</option>
      <option value="liquid/lfm-2.5-2.6b:free">Liquid LFM (Rápido)</option>
    </select>
    <button class="btn-small" id="btn-system" title="Personalidad / instrucciones">⚙️ Sistema</button>
    <button class="btn-small" id="btn-clear" title="Borrar conversación">🗑️ Limpiar</button>
  </div>
</header>

<!-- API KEY BANNER -->
<div id="api-banner" class="hidden">
  <span>🔑 API Key:</span>
  <input id="api-key-input" type="password" placeholder="sk-or-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
  <button class="btn-save" id="btn-save-key">Guardar</button>
</div>

<!-- SYSTEM PROMPT PANEL -->
<div id="system-panel">
  <label>Personalidad / Instrucciones del sistema</label>
  <textarea id="system-prompt" placeholder="Ej: Eres Noisy, un asistente amigable que responde siempre en español...">Eres Noisy, una persona inteligente, amigable y con personalidad propia. Respondes siempre en español de forma clara, detallada y útil. Eres experto en todo tipo de temas y te encanta ayudar.</textarea>
</div>

<!-- CHAT MESSAGES -->
<div id="chat">
  <div id="welcome">
    <div class="big-icon">✨</div>
    <h2>¡Hola! Soy <strong>Noisy</strong></h2>
    <p>Funciono 24/7 sin necesitar tu PC encendida.</p>
    <div class="suggestion-chips">
      <div class="chip" onclick="sendChip(this)">¿Qué puedes hacer?</div>
      <div class="chip" onclick="sendChip(this)">Explícame la inteligencia artificial</div>
      <div class="chip" onclick="sendChip(this)">Escribe un poema</div>
      <div class="chip" onclick="sendChip(this)">Dame ideas de proyectos</div>
      <div class="chip" onclick="sendChip(this)">Ayúdame a programar en Python</div>
    </div>
  </div>
</div>

<!-- INPUT FOOTER -->
<footer>
  <div class="input-row">
    <textarea id="user-input" placeholder="Escribe tu mensaje... (Enter para enviar, Shift+Enter para nueva línea)" rows="1"></textarea>
    <button class="btn-send" id="btn-send" title="Enviar">➤</button>
  </div>
  <div class="footer-note">
    OpenRouter API · Gratis · 24/7 · Sin límites — <a href="https://openrouter.ai" target="_blank" style="color:var(--accent2)">openrouter.ai</a>
  </div>
</footer>

<!-- TOAST -->
<div id="toast"></div>

<script>
  // ─────────────────────────────────────────────
  // ─────────────────────────────────────────────
  // ─────────────────────────────────────────────
  //  STATE & SAFE STORAGE
  // ─────────────────────────────────────────────
  const STORAGE_KEY = 'openrouter_api_key';
  const HISTORY_KEY = 'chat_history';
  
  function safeGet(key, def) {
    try { return localStorage.getItem(key) || def; } catch(e) { return def; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch(e) {}
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch(e) {}
  }

  let apiKey = safeGet(STORAGE_KEY, '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');
  let history = JSON.parse(safeGet(HISTORY_KEY, '[]'));
  let isLoading = false;

  // ─────────────────────────────────────────────
  //  DOM REFS
  // ─────────────────────────────────────────────
  const chat       = document.getElementById('chat');
  const welcome    = document.getElementById('welcome');
  const userInput  = document.getElementById('user-input');
  const btnSend    = document.getElementById('btn-send');
  const apiBanner  = document.getElementById('api-banner');
  const apiInput   = document.getElementById('api-key-input');
  const btnSaveKey = document.getElementById('btn-save-key');
  const modelSel   = document.getElementById('model-select');
  const statusDot  = document.getElementById('status-dot');
  const sysPanel   = document.getElementById('system-panel');
  const sysPrompt  = document.getElementById('system-prompt');
  const btnSystem  = document.getElementById('btn-system');
  const btnClear   = document.getElementById('btn-clear');
  const toast      = document.getElementById('toast');

  // ─────────────────────────────────────────────
  //  INIT
  // ─────────────────────────────────────────────
  function init() {
    if (apiKey) {
      apiBanner.classList.add('hidden');
      setStatus(true);
    } else {
      setStatus(false);
    }

    // Restore history
    if (history.length) {
      welcome.style.display = 'none';
      history.forEach(m => addBubble(m.role === 'user' ? 'user' : 'ai', m.content, false));
      scrollDown();
    }

    // Preferences
    const validModels = ['nvidia/nemotron-3-super-120b-a12b:free','google/gemma-4-31b-it:free','qwen/qwen3.8-27b:free','liquid/lfm-2.5-2.6b:free'];
    const savedModel = safeGet('groq_model', null);
    if (savedModel && validModels.includes(savedModel)) {
      modelSel.value = savedModel;
    } else {
      modelSel.value = 'nvidia/nemotron-3-super-120b-a12b:free';
      safeRemove('groq_model');
    }

    const savedSys = safeGet('groq_system', null);
    if (savedSys) sysPrompt.value = savedSys;
  }

  function setStatus(online) {
    statusDot.classList.toggle('offline', !online);
    statusDot.title = online ? 'Conectado a Groq' : 'Sin API key';
  }

  // ─────────────────────────────────────────────
  //  API KEY
  // ─────────────────────────────────────────────
  btnSaveKey.onclick = () => {
    const val = apiInput.value.trim();
    if (!val.startsWith('sk-or-') && val) {
      showToast('⚠️ La key debe empezar con sk-or-');
      return;
    }
    if (!val) { showToast('Ingresa tu API key'); return; }
    apiKey = val;
    safeSet(STORAGE_KEY, apiKey);
    apiBanner.classList.add('hidden');
    setStatus(true);
    showToast('✅ API key guardada');
  };

  // Show key on header click
  document.querySelector('.logo').addEventListener('dblclick', () => {
    apiBanner.classList.toggle('hidden');
  });

  // ─────────────────────────────────────────────
  //  SYSTEM PANEL
  // ─────────────────────────────────────────────
  btnSystem.onclick = () => sysPanel.classList.toggle('open');
  sysPrompt.onchange = () => safeSet('groq_system', sysPrompt.value);

  // ─────────────────────────────────────────────
  //  MODEL
  // ─────────────────────────────────────────────
  modelSel.onchange = () => safeSet('groq_model', modelSel.value);

  // ─────────────────────────────────────────────
  //  CLEAR
  // ─────────────────────────────────────────────
  btnClear.onclick = () => {
    if (!confirm('¿Borrar toda la conversación?')) return;
    history = [];
    safeRemove(HISTORY_KEY);
    // Clear chat except welcome
    [...chat.children].forEach(el => { if (el.id !== 'welcome') el.remove(); });
    welcome.style.display = '';
    showToast('🗑️ Conversación borrada');
  };

  // ─────────────────────────────────────────────
  //  INPUT AUTO-RESIZE
  // ─────────────────────────────────────────────
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  btnSend.addEventListener('click', (e) => {
    e.preventDefault();
    send();
  });
  
  btnSend.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Evita que el teclado se cierre y se pierda el toque en el celular
    send();
  }, {passive: false});

  // ─────────────────────────────────────────────
  //  CHIPS
  // ─────────────────────────────────────────────
  function sendChip(el) {
    userInput.value = el.textContent;
    send();
  }

  // ─────────────────────────────────────────────
  //  SEND MESSAGE
  // ─────────────────────────────────────────────
  async function send() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    if (!apiKey) {
      showToast('⚠️ Primero guarda tu API key de OpenRouter');
      apiBanner.classList.remove('hidden');
      return;
    }

    isLoading = true;
    btnSend.disabled = true;
    userInput.value = '';
    userInput.style.height = 'auto';

    // Hide welcome
    welcome.style.display = 'none';

    // Add user bubble
    addBubble('user', text);
    history.push({ role: 'user', content: text });

    // Typing indicator
    const typingEl = addTyping();
    scrollDown();

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json',
          'HTTP-Referer': 'https://noisy-ia.local',
          'X-Title': 'Noisy IA'
        },
        body: JSON.stringify({
          model: modelSel.value,
          messages: [
            { role: 'system', content: sysPrompt.value || 'Eres Noisy, una persona amigable que responde en español.' },
            ...history
          ],
          temperature: 0.7,
          max_tokens: 4096,
          stream: true
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `Error ${response.status}`);
      }

      // Remove typing indicator, add AI bubble for streaming
      typingEl.remove();
      const aiBubble = addBubble('ai', '', false);
      let fullText = '';

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const lines = decoder.decode(value).split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            if (delta) {
              fullText += delta;
              aiBubble.innerHTML = renderMarkdown(fullText);
              scrollDown();
            }
          } catch {}
        }
      }

      history.push({ role: 'assistant', content: fullText });
      saveHistory();

    } catch (err) {
      typingEl?.remove();
      addBubble('ai', `❌ **Error:** ${err.message}\n\nVerifica tu API key o revisa [openrouter.ai](https://openrouter.ai)`, false);
    }

    isLoading = false;
    btnSend.disabled = false;
    userInput.focus();
  }

  // ─────────────────────────────────────────────
  //  DOM HELPERS
  // ─────────────────────────────────────────────
  function addBubble(role, text, scroll = true) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '✨';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'ai') {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);

    if (scroll) scrollDown();
    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = `
      <div class="avatar">✨</div>
      <div class="bubble">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chat.appendChild(msg);
    return msg;
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  function saveHistory() {
    // Keep last 100 messages to avoid localStorage limits
    if (history.length > 100) history = history.slice(-100);
    safeSet(HISTORY_KEY, JSON.stringify(history));
  }

  // ─────────────────────────────────────────────
  //  MARKDOWN RENDERER (lightweight)
  // ─────────────────────────────────────────────
  function renderMarkdown(text) {
    // Escape HTML first
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Code blocks (must come before inline code)
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.trim()}</code></pre>`
    );

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // Bold & Italic
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    // Blockquotes
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

    // Lists
    html = html.replace(/^\- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
    html = html.replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>');

    // Links
    html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');

    // Line breaks
    html = html.replace(/\n\n/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = `<p>${html}</p>`;

    // Clean up empty paragraphs
    html = html.replace(/<p>\s*<\/p>/g, '');

    return html;
  }

  // ─────────────────────────────────────────────
  //  TOAST
  // ─────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ─────────────────────────────────────────────
  //  START
  // ─────────────────────────────────────────────
  init();
</script>
</body>
</html>
